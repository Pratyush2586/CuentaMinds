# Rehearsal mapping (Task 17): written from `closeops profile data/rehearsal/unseen` only,
# for the column-scrambled seed-2026 dataset made by scripts/rehearsal_scramble.py.
period_end: 2026-10-31
tables:
  vendors:
    files: ["creditor_master.csv"]
    columns:
      vendor_id: "Creditor"
      entity: "BUKRS"
      name: "Name 1"
      country: "Ctry"
      vat_id: "Tax Number"
      iban: "Bank Acct (IBAN)"
  vendor_bank_history:
    files: ["vendor_bank_changes.csv"]
