      iban: "New IBAN"
      changed_at: "Changed On"
      changed_by: "Changed By"
  purchase_orders:
    files: ["purchase_orders.xlsx"]
    sheet: "PO Lines"
    columns:
      po_id: "PO Number"
      entity: "Company"
      vendor_id: "Supplier"
      po_date: "PO Date"
      item: "Material"
      qty: "Ordered Qty"
      unit_price: "Net Price"
      currency: "Curr"
      approved_by: "Approver"
  goods_receipts:
