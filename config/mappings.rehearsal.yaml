      name: "Description"
      type: "Account Type"
  fx_rates:
    files: ["fx.csv"]
    columns:
      date: "Date"
      currency: "Currency"
      rate_to_eur: "EUR per Unit"
  tax_rates:
    files: ["tax_rates.csv"]
