[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "closeops"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "pandas", "rapidfuzz", "pyyaml", "openpyxl", "pdfplumber",
  "streamlit", "anthropic", "claude-agent-sdk",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
closeops = "closeops.cli:main"
bankrec = "bankrec.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
